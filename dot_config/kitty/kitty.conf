dynamic_background_opacity yes
confirm_os_window_close 0

# Send CSI-u sequences for keys terminals normally swallow.
# tmux re-emits them (extended-keys csi-u), nvim sees <C-.> etc.
map ctrl+. send_text all \x1b[46;5u
map ctrl+/ send_text all \x1b[47;5u

# tmux grabs mouse events; still let kitty open detected links.
mouse_map left click grabbed mouse_handle_click link

include colors.conf
